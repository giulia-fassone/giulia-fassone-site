const toggle=document.getElementById('projects-toggle'),dropdown=document.getElementById('projects-dropdown');toggle.addEventListener('click',e=>{e.preventDefault();const open=dropdown.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));});document.addEventListener('click',e=>{if(!toggle.contains(e.target)&&!dropdown.contains(e.target)){dropdown.classList.remove('open');toggle.setAttribute('aria-expanded','false');}});
const images=Array.from(document.querySelectorAll('.project-img')),viewer=document.getElementById('viewer'),viewerImg=document.getElementById('viewer-img'),counter=document.getElementById('viewer-counter');let current=0;function showImage(i){current=(i+images.length)%images.length;viewerImg.src=images[current].src;viewerImg.alt=images[current].alt;counter.textContent=(current+1)+' / '+images.length;}images.forEach((img,i)=>img.addEventListener('click',()=>{showImage(i);viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');}));document.getElementById('viewer-prev').addEventListener('click',e=>{e.stopPropagation();showImage(current-1)});document.getElementById('viewer-next').addEventListener('click',e=>{e.stopPropagation();showImage(current+1)});viewer.addEventListener('click',e=>{if(e.target===viewer){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}});document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape'){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}if(e.key==='ArrowLeft')showImage(current-1);if(e.key==='ArrowRight')showImage(current+1)});
