@font-face{font-family:TaylorGothic;src:url('Taylor-Gothic.woff2') format('woff2'),url('Taylor-Gothic.woff') format('woff')}
:root{--page-margin:.5in;--grid-gap:18px;--text:#5B2C10;--yellow:#FFED00}*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:#f5f2e9}body{font-family:Arial,sans-serif;color:var(--text)}

.header{display:flex;align-items:center;justify-content:space-between;padding:4px 20px;flex-wrap:wrap;gap:12px;position:relative;z-index:10}
.brand{display:flex;align-items:center;margin-left:-20px;text-decoration:none}
.symbol{height:54px;width:auto;display:block;margin-right:-10px}
.signature{height:108px;width:auto;display:block}
.menu{display:flex;gap:28px;align-items:baseline}
.menu-item{position:relative}
.menu a{font-size:20px;color:var(--text);text-decoration:none;text-shadow:none;cursor:pointer}
.dropdown{display:none;position:absolute;top:100%;left:0;margin-top:10px;min-width:240px;z-index:20}
.dropdown.open{display:block}
.dropdown a{display:block;font-size:18px;padding:6px 0;white-space:nowrap}

/* PINTEREST GRID (Flows to fill gaps) */
.project-grid {
  column-count: 3;
  column-gap: var(--grid-gap);
  max-width: 1600px;
  width: 100%;
  padding: var(--page-margin);
  margin: 0 auto 100px;
}

.project-item {
  display: inline-block;
  width: 100%;
  margin-bottom: var(--grid-gap);
  padding: 0;
  cursor: zoom-in;
  break-inside: avoid;
}

.project-item img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

/* CAROUSEL */
.viewer{display:none;position:fixed;inset:0;padding:60px 90px;background:rgba(30,20,10,.94);align-items:center;justify-content:center;z-index:99999;cursor:zoom-out}
.viewer.open{display:flex}
.viewer-stage{display:flex;width:100%;height:100%;align-items:center;justify-content:center}
.viewer-stage img{display:block;width:auto;height:auto;max-width:100%;max-height:78vh;object-fit:contain}
.viewer-arrow{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;width:34px;height:56px;padding:0;border:0;background:transparent;color:var(--yellow);cursor:pointer;z-index:100001}
.viewer-arrow svg{width:23px;height:38px;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.prev{left:24px}
.next{right:24px}
.viewer-counter{position:absolute;bottom:18px;left:0;width:100%;color:var(--yellow);text-align:center;font:14px Arial,sans-serif;pointer-events:none}
.copyright{position:fixed;bottom:14px;left:0;width:100%;text-align:center;font:12px Arial,sans-serif;color:var(--text);z-index:5;pointer-events:none}

/* Soft dropdown */
.dropdown{background:rgba(245,242,233,0.68)!important;-webkit-backdrop-filter:blur(16px) saturate(115%);backdrop-filter:blur(16px) saturate(115%);border:1px solid rgba(91,44,16,0.07);border-radius:8px;padding:8px 14px!important;box-shadow:0 5px 18px rgba(30,20,10,0.045)!important;overflow:hidden}

@media(max-width:700px){
  :root{--grid-gap:12px;--page-margin:12px}
  .header{padding:6px 16px 10px;gap:8px}
  .symbol{height:40px;margin-right:-6px}
  .signature{height:60px}
  .menu{gap:14px}
  .menu a{font-size:14px}
  .dropdown{min-width:200px}
  .dropdown a{font-size:14px}
  
  .project-grid {
    column-count: 2;
    padding-bottom: 80px;
  }
  
  .viewer{padding:50px 42px}
  .viewer-stage img{max-height:72vh}
  .prev{left:2px}
  .next{right:2px}
  .viewer-counter{bottom:14px;font-size:12px}
  .copyright{font-size:10px}
}
</style>

<script>
const toggle=document.getElementById('projects-toggle'),dropdown=document.getElementById('projects-dropdown');
toggle.addEventListener('click',e=>{e.preventDefault();const open=dropdown.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));});
document.addEventListener('click',e=>{if(!toggle.contains(e.target)&&!dropdown.contains(e.target)){dropdown.classList.remove('open');toggle.setAttribute('aria-expanded','false');}});

const images=Array.from(document.querySelectorAll('.project-img')),viewer=document.getElementById('viewer'),viewerImg=document.getElementById('viewer-img'),counter=document.getElementById('viewer-counter');
let current=0;
function showImage(i){current=(i+images.length)%images.length;viewerImg.src=images[current].src;viewerImg.alt=images[current].alt;counter.textContent=(current+1)+' / '+images.length;}
images.forEach((img,i)=>img.addEventListener('click',()=>{showImage(i);viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');}));
document.getElementById('viewer-prev').addEventListener('click',e=>{e.stopPropagation();showImage(current-1)});
document.getElementById('viewer-next').addEventListener('click',e=>{e.stopPropagation();showImage(current+1)});
viewer.addEventListener('click',e=>{if(e.target===viewer){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}});
document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape'){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}if(e.key==='ArrowLeft')showImage(current-1);if(e.key==='ArrowRight')showImage(current+1)});
</script>
