<!DOCTYPE html>
<!-- deployment-refresh: 2026-10-27 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body { margin:0; padding:0; min-height:100%; overflow-x:hidden; background:transparent; }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
    min-height: max(100vh, 61.8vw);
    overflow-y: auto;
  }

  .scene {
    position: absolute;
    left: 50vw;
    top: 0;
    width: max(100vw, 161.8vh);
    height: max(75.10vw, 121.5vh);
    transform: translate(-50%, -17.72%);
    container-type: size;
    z-index: 0;
  }

  .bg {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  .bg img {
    width: 100%;
    height: 100%;
    display: block;
  }

  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(100, 149, 237, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 250ms ease;
  }

  @media (hover: hover) {
    body.thumbnail-hover .bg::after { opacity: 1; }
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 20px 4px 20px;
    flex-wrap: wrap;
    gap: 12px;
    position: relative;
    z-index: 10;
  }

  .header { pointer-events: none; }
  .header a { pointer-events: auto; }

  .brand {
    display: flex;
    align-items: center;
    margin-left: -20px;
    text-decoration: none;
  }

  .symbol {
    height: 54px;
    width: auto;
    display: block;
    margin-right: -10px;
  }

  .signature {
    height: 108px;
    width: auto;
    display: block;
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item { position: relative; }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color:#5B2C10; text-decoration:none; cursor:pointer;
  }

  .menu a:hover {
    text-decoration: none;
    color: #FFED00;
  }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: rgba(245, 242, 233, 0.68);
    padding: 8px 14px;
    box-shadow: 0 5px 18px rgba(30, 20, 10, 0.045);
    border-radius: 8px;
    -webkit-backdrop-filter: blur(16px) saturate(115%);
    backdrop-filter: blur(16px) saturate(115%);
    border: 1px solid rgba(91, 44, 16, 0.07);
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open { display: block; }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
    color:#5B2C10;
  }

  .dropdown a:hover {
    text-decoration: none;
    color: #FFED00;
  }

  .collage {
    position: absolute;
    inset: 0;
    overflow: visible;
    z-index: 1;
  }

  .thumb {
    position: absolute;
    width: 10.25cqw;
  }

  .thumb img {
    width: 100%;
    display: block;
    cursor: pointer;
  }

  .size-130 { width: 11.35cqw; }
  .size-140 { width: 12.23cqw; }
  .size-200 { width: 17.42cqw; }
  .size-300 { width: 26.13cqw; }
  .size-400 { width: 34.85cqw; }

  /* Desktop collage positions are tuned to the annotated homepage screenshot. */
  .urn { left: 18%; top: 70cqh; width: 8.86cqw; }
  .ruderal-1 { left: 18%; top: 38.5cqh; width: 20.03cqw; }
  .ruderal-1 img { transform: scaleX(0.75); }
  .lie-soft { left: 22%; top: 80cqh; }
  .fruits { left: 78%; top: 86.5cqh; width: 9.65cqw; }
  .fruits img { transform: rotate(10deg); }
  .ruderal-2 { right: 0.25cqw; top: 59.6cqh; width: 24.45cqw; }
  .ruderal-2 img { transform: rotate(-30deg) scaleY(0.6); }
  .remains { left: 66%; top: 81cqh; width: 11.03cqw; }
  .stalactite { right: calc(33% - 6.6cqw); top: 20cqh; z-index: 50; }
  .tools { left: 38%; top: 88cqh; width: 8.2cqw; }

  .faberge    { left: 65%; top: 64.5cqh; width: 7.5cqw; }
  .apple      { right: 0.5cqw; top: 86.5cqh; }
  .butter     { left: 30%; top: 23.5cqh; width: 13.2cqw; }
  .she-hath   { left: -6.5%; top: 59.5cqh; width: 40.28cqw; }
  .she-hath img { transform: scaleX(-1); }
  .sin-eater  { left: calc(50% - 17.02cqw); top: 65.1cqh; width: 34.04cqw; }

  @media (min-width: 701px) and (max-width: 1515px) {
    .stalactite { right: 30cqw; }
  }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(30, 20, 10, 0.85);
    align-items: center;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
  }

  .copyright {
    position: fixed;
    bottom: 14px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    html, body { overflow: auto; height: auto; }
    .scene {
      position: relative;
      left: auto;
      top: auto;
      bottom: auto;
      width: auto;
      height: auto;
      transform: none;
      container-type: normal;
      z-index: auto;
    }
    .bg { position: fixed; inset: 0; z-index: -1; }
    .header { padding: 6px 16px 10px; gap: 8px; }
    .symbol { height: 40px; margin-right: -6px; }
    .signature { height: 60px; }
    .menu { gap: 14px; }
    .menu a { font-size: 14px; }
    .dropdown { min-width: 200px; }
    .dropdown a { font-size: 14px; }

    .collage {
      position: relative;
      inset: auto;
      height: auto;
      padding: 40px 16px 120px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .thumb,
    .size-130, .size-140, .size-200, .size-300, .size-400 {
      position: static;
      width: 100%;
      margin: 0;
    }

    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="brand">
      <img src="Symbol.png" alt="" class="symbol">
      <img src="signature.png" alt="Giulia Fassone" class="signature">
    </a>
    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle">Projects</a>
        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal-i.html">Ruderal I</a>
          <a href="ruderal-ii.html">Ruderal II</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
          <a href="sketchbook.html">Sketchbook</a>
        </div>
      </div>
      <a href="sketchbook.html">Sketchbook</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="scene">
    <div class="bg">
      <img src="P10907.jpg" alt="">
    </div>

  <div class="collage">
    <div class="thumb urn">
      <a href="appetite.html"><img src="Fermentation_Urn.png" alt="Appetite"></a>
    </div>
    <div class="thumb ruderal-1 size-200">
      <a href="ruderal-i.html"><img src="Ruderal-1-thumbnail.png" alt="Ruderal I"></a>
    </div>
    <div class="thumb lie-soft size-200">
      <a href="lie-soft.html"><img src="lie-soft-thumbnail.png" alt="Lie Soft"></a>
    </div>
    <div class="thumb fruits size-130">
      <a href="fruits-of-labour.html"><img src="Fruits-of-labour-thumbnail.png" alt="Fruits of Labour"></a>
    </div>
    <div class="thumb ruderal-2 size-140">
      <a href="ruderal-ii.html"><img src="ruderal-II-thumbnail.png" alt="Ruderal II"></a>
    </div>
    <div class="thumb remains size-130">
      <a href="the-remains-of-a-meal.html"><img src="remains-of-a-meal-thumbnail.png" alt="The Remains Of A Meal"></a>
    </div>
    <div class="thumb stalactite size-130">
      <a href="archaeology-of-self.html"><img src="stalactite-thumbnail.png" alt="Archaeology Of Self"></a>
    </div>
    <div class="thumb tools">
      <a href="tools.html"><img src="self-care-object-thumbnail.png" alt="Tools"></a>
    </div>

    <div class="thumb faberge"><img src="Faberge.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb apple"><img src="apple-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb butter size-300"><img src="Hooked-stone-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb she-hath size-400"><img src="she-hath-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb sin-eater size-130"><img src="Sin-Eater-Full-thumbnail.png" alt="" class="lightbox-trigger"></div>
  </div>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.thumb').forEach(thumb => {
      thumb.addEventListener('mouseenter', () => document.body.classList.add('thumbnail-hover'));
      thumb.addEventListener('mouseleave', () => document.body.classList.remove('thumbnail-hover'));
    });

    document.querySelectorAll('.lightbox-trigger').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('open');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    });

    document.addEventListener('click', (e) => {
      const clickedImg = e.target.closest('img');
      const clickedLink = e.target.closest('a');
      const clickedDropdown = e.target.closest('.dropdown');
      if (!clickedImg && !clickedLink && !clickedDropdown) {
        window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
