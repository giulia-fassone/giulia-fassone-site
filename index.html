<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 40px;
    flex-wrap: wrap;
    gap: 16px;
    position: relative;
    z-index: 10;
  }

  .signature {
    display: block;
    height: 120px;
    width: auto;
    text-decoration: none;
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item {
    position: relative;
  }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #5B2C10;
    text-decoration: none;
    cursor: pointer;
  }

  .menu a:hover { text-decoration: underline; }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: rgba(245, 240, 230, 0.95);
    backdrop-filter: blur(4px);
    padding: 16px 22px;
    box-shadow: 2px 2px 10px rgba(90, 60, 30, 0.15);
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open { display: block; }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
  }

  .dropdown a:hover { text-decoration: underline; }

  /* --- Collage: thumbnails arranged in an arc along the bottom third --- */
  .collage {
    position: relative;
    width: 100%;
    height: 65vh;
    margin-top: 5vh;
  }

  .collage img {
    display: block;
    cursor: pointer;
  }

  .thumb {
    position: absolute;
    width: 440px;
  }

  /* Arc positions — 8 slots, first is free-floating, second is Appetite */
  .thumb-1 { left: 2%;  bottom: 5vh; }
  .thumb-2 { left: 14%; bottom: 10vh; }
  .thumb-3 { left: 27%; bottom: 15vh; }
  .thumb-4 { left: 40%; bottom: 18vh; }
  .thumb-5 { left: 53%; bottom: 18vh; }
  .thumb-6 { left: 66%; bottom: 15vh; }
  .thumb-7 { left: 79%; bottom: 10vh; }
  .thumb-8 { left: 90%; bottom: 5vh; }

  .thumb .fermacarte {
    position: absolute;
    bottom: -30px;
    right: -30px;
    width: 160px;
    cursor: pointer;
  }

  .copyright {
    position: fixed;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .header { padding: 20px 20px; gap: 12px; }
    .signature { height: 60px; }
    .menu { gap: 14px; }
    .menu a { font-size: 14px; }
    .dropdown { min-width: 200px; padding: 12px 16px; }
    .dropdown a { font-size: 14px; }
    .collage { height: auto; padding: 20px; }
    .thumb { position: static; width: 45%; margin: 8px; display: inline-block; }
    .thumb .fermacarte { width: 60px; bottom: -10px; right: -10px; }
    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html">
      <img src="my_signature.png" alt="Giulia Fassone" class="signature">
    </a>
    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle">Projects</a>
        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal.html">Ruderal</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
        </div>
      </div>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="collage">
    <!-- Slot 1: free-floating, not linked -->
    <img src="Faberge.png" alt="" class="thumb thumb-1">

    <!-- Slot 2: Appetite, with fermacarte -->
    <div class="thumb thumb-2">
      <a href="appetite.html">
        <img src="Faberge.png" alt="Appetite">
      </a>
      <img src="Fermentation_Urn.png" alt="Appetite" class="fermacarte">
    </div>
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });
  </script>

</body>
</html>
