<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 28px 20px;
    flex-wrap: wrap;
    gap: 16px;
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .symbol {
    height: 54px;
    width: auto;
    display: block;
  }

  .signature {
    height: 108px;
    width: auto;
    display: block;
    filter: drop-shadow(0 0 12px rgba(100, 120, 200, 0.9));
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item {
    position: relative;
  }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #5B2C10;
    text-decoration: none;
    cursor: pointer;
  }

  .menu a:hover { text-decoration: underline; }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: transparent;
    backdrop-filter: blur(4px);
    padding: 16px 22px;
    box-shadow: 2px 2px 10px rgba(90, 60, 30, 0.25);
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open { display: block; }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
  }

  .dropdown a:hover { text-decoration: underline; }

  .collage {
    position: relative;
    width: 100%;
    height: 90vh;
    margin-top: 2vh;
  }

  .thumb {
    position: absolute;
    width: 160px;
  }

  .thumb img {
    width: 100%;
    display: block;
    cursor: pointer;
  }

  /* Sizes */
  .size-130 { width: 208px; }
  .size-80  { width: 128px; }

  /* Top arc — projects */
  .t1  { left: 2%;  top: 30%; }
  .t2  { left: 15%; top: 22%; }
  .t3  { left: 28%; top: 16%; }
  .t4  { left: 41%; top: 12%; }
  .t5  { left: 54%; top: 12%; }
  .t6  { left: 67%; top: 16%; }
  .t7  { left: 80%; top: 22%; }

  /* Stalactite, top right, near menu */
  .stalactite { right: 2%; top: 8%; }

  /* Lower rainbow — free-floating */
  .r1 { left: 8%;  top: 62%; }
  .r2 { left: 24%; top: 58%; }
  .r3 { left: 40%; top: 56%; }
  .r4 { left: 56%; top: 56%; }
  .r5 { left: 72%; top: 58%; }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(30, 20, 10, 0.85);
    align-items: center;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
  }

  .copyright {
    position: fixed;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .header { padding: 10px 16px 20px; gap: 10px; }
    .symbol { height: 40px; }
    .signature { height: 60px; }
    .menu { gap: 14px; }
    .menu a { font-size: 14px; }
    .dropdown { min-width: 200px; padding: 12px 16px; }
    .dropdown a { font-size: 14px; }
    .collage { height: auto; padding: 40px 20px 120px; }
    .thumb, .size-130, .size-80 { position: static; width: 100px; margin: 12px; display: inline-block; }
    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html" class="brand">
      <img src="Symbol.png" alt="" class="symbol">
      <img src="my_signature.png" alt="Giulia Fassone" class="signature">
    </a>
    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle">Projects</a>
        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal-i.html">Ruderal I</a>
          <a href="ruderal-ii.html">Ruderal II</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
        </div>
      </div>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="collage">
    <!-- Top arc — projects -->
    <div class="thumb t1">
      <a href="appetite.html"><img src="Fermentation_Urn.png" alt="Appetite"></a>
    </div>
    <div class="thumb t2">
      <a href="tools.html"><img src="self-care-object-thumbnail.png" alt="Tools"></a>
    </div>
    <div class="thumb t3">
      <a href="ruderal-i.html"><img src="Ruderal-1-thumbnail.png" alt="Ruderal I"></a>
    </div>
    <div class="thumb t4 size-130">
      <a href="lie-soft.html"><img src="lie-soft-thumbnail.png" alt="Lie Soft"></a>
    </div>
    <div class="thumb t5 size-130">
      <a href="fruits-of-labour.html"><img src="Fruits-of-labour-thumbnail.png" alt="Fruits of Labour"></a>
    </div>
    <div class="thumb t6">
      <a href="ruderal-ii.html"><img src="ruderal-II-thumbnail.png" alt="Ruderal II" class="size-130"></a>
    </div>
    <div class="thumb t7 size-130">
      <a href="the-remains-of-a-meal.html"><img src="remains-of-a-meal-thumbnail.png" alt="The Remains Of A Meal"></a>
    </div>

    <!-- Stalactite — top right, near menu -->
    <div class="thumb stalactite">
      <a href="archaeology-of-self.html"><img src="stalactite-thumbnail.png" alt="Archaeology Of Self"></a>
    </div>

    <!-- Lower rainbow — free-floating (lightbox only) -->
    <div class="thumb r1"><img src="Faberge.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb r2"><img src="apple-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb r3"><img src="butter-fingers-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb r4"><img src="she-hath-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb r5 size-130"><img src="Sin-Eater-thumbnail.png" alt="" class="lightbox-trigger"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.lightbox-trigger').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('open');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    });
  </script>

</body>
</html>
