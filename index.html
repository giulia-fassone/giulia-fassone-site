<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #4A6FDC;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 28px 40px;
    flex-wrap: wrap;
    gap: 16px;
  }

  .name {
    font-family: 'TaylorGothic', serif;
    font-size: 32px;
    text-decoration: none;
    color: #5B2C10;
    line-height: 1;
  }

  .menu {
    display: flex;
    gap: 32px;
  }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 24px;
    color: #5B2C10;
    text-decoration: none;
  }

  .menu a:hover { text-decoration: underline; }

  @media (max-width: 700px) {
    .header { padding: 20px 20px; gap: 12px; }
    .name { font-size: 22px; }
    .menu { gap: 18px; }
    .menu a { font-size: 16px; }
  }
</style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="name">Giulia Fassone</a>
    <nav class="menu">
      <a href="index.html">Projects</a>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

</body>
</html>
