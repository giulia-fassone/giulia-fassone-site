<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(90, 90, 175, 0.45);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 28px 40px;
    flex-wrap: wrap;
    gap: 16px;
    position: relative;
    z-index: 1;
  }

  .name {
    font-family: 'TaylorGothic', serif;
    font-size: 32px;
    text-decoration: none;
    color: #5B2C10;
    line-height: 1;
    text-shadow: 1px 1px 2px rgba(120, 140, 200, 0.4);
  }

  .menu {
    display: flex;
    gap: 28px;
  }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #5B2C10;
    text-decoration: none;
    text-shadow: 1px 1px 2px rgba(120, 140, 200, 0.4);
  }

  .menu a:hover { text-decoration: underline; }

  .copyright {
    position: fixed;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    text-shadow: 1px 1px 2px rgba(120, 140, 200, 0.4);
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .header { padding: 20px 20px; gap: 12px; }
    .name { font-size: 22px; }
    .menu { gap: 16px; }
    .menu a { font-size: 15px; }
    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html" class="name">Giulia Fassone</a>
    <nav class="menu">
      <a href="index.html">Projects</a>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

</body>
</html>
