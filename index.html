<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 28px 20px;
    flex-wrap: wrap;
    gap: 16px;
    position: relative;
    z-index: 10;
  }

  .signature {
    display: block;
    height: 108px;
    width: auto;
    text-decoration: none;
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item {
    position: relative;
  }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #5B2C10;
    text-decoration: none;
    cursor: pointer;
  }

  .menu a:hover { text-decoration: underline; }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: transparent;
    backdrop-filter: blur(4px);
    padding: 16px 22px;
    box-shadow: 2px 2px 10px rgba(90, 60, 30, 0.25);
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open { display: block; }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
  }

  .dropdown a:hover { text-decoration: underline; }

  .collage {
    position: relative;
    width: 100%;
    height: 70vh;
    margin-top: 2vh;
  }

  .thumb {
    position: absolute;
    width: 160px;
  }

  .appetite-wrap {
    position: absolute;
    width: 160px;
    left: 35%;
    top: 40%;
  }

  .appetite-wrap a img {
    width: 100%;
    display: block;
    cursor: pointer;
  }

  .appetite-wrap .fermacarte {
    position: absolute;
    bottom: -30px;
    right: -30px;
    width: 160px;
    cursor: pointer;
  }

  .faberge-wrap {
    position: absolute;
    width: 160px;
    left: 10%;
    top: 45%;
  }

  .faberge-wrap img {
    width: 100%;
    display: block;
    cursor: pointer;
  }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(30, 20, 10, 0.85);
    align-items: center;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
  }

  .copyright {
    position: fixed;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .header { padding: 10px 16px 20px; gap: 10px; }
    .signature { height: 54px; }
    .menu { gap: 14px; }
    .menu a { font-size: 14px; }
    .dropdown { min-width: 200px; padding: 12px 16px; }
    .dropdown a { font-size: 14px; }
    .collage { height: auto; padding: 40px 20px 120px; }
    .thumb { position: static; width: 120px; margin: 20px; display: inline-block; }
    .appetite-wrap { position: static; width: 120px; margin: 20px; display: inline-block; }
    .appetite-wrap .fermacarte { width: 90px; bottom: -12px; right: -12px; }
    .faberge-wrap { position: static; width: 120px; margin: 20px; display: inline-block; }
    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html">
      <img src="my_signature.png" alt="Giulia Fassone" class="signature">
    </a>
    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle">Projects</a>
        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal.html">Ruderal</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
        </div>
      </div>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="collage">
    <div class="appetite-wrap">
      <a href="appetite.html">
        <img src="Faberge.png" alt="Appetite">
      </a>
      <img src="Fermentation_Urn.png" alt="Appetite" class="fermacarte">
    </div>

    <div class="faberge-wrap">
      <img src="Faberge.png" alt="" class="faberge-lightbox">
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.faberge-lightbox').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('open');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    });
  </script>

</body>
</html>
