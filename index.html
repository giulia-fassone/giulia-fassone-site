
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 20px 4px 20px;
    flex-wrap: wrap;
    gap: 12px;
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 4px;
    text-decoration: none;
  }

  .symbol { height: 54px; width: auto; display: block; }

  .signature {
    height: 108px;
    width: auto;
    display: block;
    filter: drop-shadow(0 0 10px #FFED00);
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item { position: relative; }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #FFED00;
    text-decoration: none;
    cursor: pointer;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .menu a:hover { text-decoration: underline; }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: transparent;
    backdrop-filter: blur(4px);
    padding: 16px 22px;
    box-shadow: 2px 2px 10px rgba(90, 60, 30, 0.25);
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open { display: block; }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
    color: #FFED00;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .dropdown a:hover { text-decoration: underline; }

  .collage {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;
  }

  .thumb {
    position: absolute;
    width: 140px;
  }

  .thumb img {
    width: 100%;
    display: block;
    cursor: pointer;
  }

  .size-130 { width: 182px; }
  .size-140 { width: 196px; }
  .size-300 { width: 420px; }
  .size-400 { width: 560px; }

  .urn { left: 44%; top: 38%; }
  .ruderal-1 { left: 22%; top: 22%; }
  .lie-soft { left: 32%; top: 50%; }
  .fruits { left: 52%; top: 18%; }
  .ruderal-2 { left: 66%; top: 28%; }
  .remains { left: 78%; top: 20%; }
  .stalactite { right: calc(33% - 90px); top: 0; z-index: 5; }
  .tools { left: 6%; top: 62%; }

  .faberge    { left: 6%;  top: 42%; }
  .apple      { left: 14%; top: 46%; }
  .butter     { left: 24%; top: 30%; }
  .she-hath   { left: 70%; top: 55%; }
  .sin-eater  { left: 56%; top: 62%; }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(30, 20, 10, 0.85);
    align-items: center;
    justify-content: center;
    padding: 40px;
    box-sizing: border-box;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 100%;
    max-height: 88vh;
    object-fit: contain;
  }

  .copyright {
    position: fixed;
    bottom: 14px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    html, body { overflow: auto; height: auto; }
    .header { padding: 6px 16px 10px; gap: 8px; }
    .symbol { height: 40px; }
    .signature { height: 60px; }
    .menu { gap: 14px; }
    .menu a { font-size: 14px; }
    .dropdown { min-width: 200px; padding: 12px 16px; }
    .dropdown a { font-size: 14px; }
    .collage { position: relative; height: auto; padding: 40px 20px 120px; }
    .thumb, .size-130, .size-140, .size-300, .size-400 { position: static; width: 100px; margin: 12px; display: inline-block; }
    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html" class="brand">
      <img src="Symbol.png" alt="" class="symbol">
      <img src="my_signature.png" alt="Giulia Fassone" class="signature">
    </a>
    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle">Projects</a>
        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal-i.html">Ruderal I</a>
          <a href="ruderal-ii.html">Ruderal II</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
        </div>
      </div>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="collage">
    <div class="thumb urn">
      <a href="appetite.html"><img src="Fermentation_Urn.png" alt="Appetite"></a>
    </div>
    <div class="thumb ruderal-1">
      <a href="ruderal-i.html"><img src="Ruderal-1-thumbnail.png" alt="Ruderal I"></a>
    </div>
    <div class="thumb lie-soft size-140">
      <a href="lie-soft.html"><img src="lie-soft-thumbnail.png" alt="Lie Soft"></a>
    </div>
    <div class="thumb fruits size-130">
      <a href="fruits-of-labour.html"><img src="Fruits-of-labour-thumbnail.png" alt="Fruits of Labour"></a>
    </div>
    <div class="thumb ruderal-2 size-140">
      <a href="ruderal-ii.html"><img src="ruderal-II-thumbnail.png" alt="Ruderal II"></a>
    </div>
    <div class="thumb remains size-130">
      <a href="the-remains-of-a-meal.html"><img src="remains-of-a-meal-thumbnail.png" alt="The Remains Of A Meal"></a>
    </div>
    <div class="thumb stalactite size-130">
      <a href="archaeology-of-self.html"><img src="stalactite-thumbnail.png" alt="Archaeology Of Self"></a>
    </div>
    <div class="thumb tools">
      <a href="tools.html"><img src="self-care-object-thumbnail.png" alt="Tools"></a>
    </div>

    <div class="thumb faberge"><img src="Faberge.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb apple"><img src="apple-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb butter size-300"><img src="butter-fingers-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb she-hath size-400"><img src="she-hath-thumbnail.png" alt="" class="lightbox-trigger"></div>
    <div class="thumb sin-eater size-130"><img src="Sin-Eater-thumbnail.png" alt="" class="lightbox-trigger"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    document.querySelectorAll('.lightbox-trigger').forEach(img => {
      img.addEventListener('click', () => {
        lightboxImg.src = img.src;
        lightbox.classList.add('open');
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('open');
      lightboxImg.src = '';
    });
  </script>

</body>
</html>
