<!DOCTYPE html>
<html>
<head>
<style>
  .carousel {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.8);
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .carousel.open { display: flex; }
  .carousel img { max-width: 80vw; max-height: 80vh; }
  .carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: yellow;
    border: none;
    font-size: 40px;
    padding: 10px 20px;
    cursor: pointer;
  }
  .carousel-btn.prev { left: 20px; }
  .carousel-btn.next { right: 20px; }
</style>
</head>
<body>

<img src="Baton-P1100275-1-2.jpg" id="thumb" style="width: 200px; cursor: pointer;">

<div class="carousel" id="carousel">
  <button class="carousel-btn prev" id="prev">‹</button>
  <img id="carousel-img" src="">
  <button class="carousel-btn next" id="next">›</button>
</div>

<script>
  document.getElementById('thumb').addEventListener('click', function() {
    document.getElementById('carousel-img').src = this.src;
    document.getElementById('carousel').classList.add('open');
  });

  document.getElementById('carousel').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });
</script>

</body>
</html>
