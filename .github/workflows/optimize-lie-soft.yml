name: Optimize Lie Soft gallery images

on:
  push:
    branches: [main]
    paths:
      - "Butter2.jpg"
      - "Lie-Soft2.jpg"
      - "Lie_soft_text.png"
      - "Cast-Moss-Fingers.jpg"
      - "Sin-Proof-2025.jpg"
      - "Baton-P1100275-1-2.jpg"
      - "Hooked-stone-thumbnail.png"
      - "Butter3.jpg"
      - "Givetake2.jpg"
      - "1.jpg"
      - "2.jpg"
      - "Butter-Fingers.jpg"
      - "ClippedClamped.jpg"
      - "Cushion.jpg"
      - "Givetake.jpg"
      - "Joint-pain.jpg"
      - "Cushion-P1100288.jpg"
      - ".github/workflows/optimize-lie-soft.yml"
      - "scripts/optimize_lie_soft.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Convert gallery images to WebP
        run: python scripts/optimize_lie_soft.py

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optimized/
          if git diff --cached --quiet; then
            echo "Optimized images are already up to date."
            exit 0
          fi
          git commit -m "Add optimized WebP images for Lie Soft"
          git push origin HEAD:main
