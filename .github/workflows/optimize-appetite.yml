name: Optimize Appetite images

on:
  push:
    branches: [main]
    paths:
      - "originals/appetite/**"
      - "scripts/optimize_appetite.py"
      - ".github/workflows/optimize-appetite.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Optimise Appetite images and build review grid
        run: python scripts/optimize_appetite.py
      - name: Commit optimised images and review grid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optimized/appetite/ appetite-review.html
          if git diff --cached --quiet; then
            echo "Optimised images are already up to date."
            exit 0
          fi
          git commit -m "Optimise Appetite images and add review grid"
          git push origin HEAD:main
