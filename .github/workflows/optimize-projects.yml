name: Optimise project and sketchbook images

on:
  push:
    branches: [main]
    paths:
      - "originals/archaeology-of-self/**"
      - "originals/ruderal-i/**"
      - "originals/ruderal-ii/**"
      - "originals/fruits-of-labour/**"
      - "originals/the-remains-of-a-meal/**"
      - "originals/tools/**"
      - "originals/sketchbook/**"
      - "scripts/optimize_projects.py"
      - ".github/workflows/optimize-projects.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade Pillow
      - name: Optimise project and sketchbook images
        run: python scripts/optimize_projects.py
      - name: Commit optimised images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add optimized/
          if git diff --cached --quiet; then
            echo "Optimised images are already up to date."
            exit 0
          fi
          git commit -m "Optimise project and sketchbook images"
          git push origin HEAD:main
