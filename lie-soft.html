<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lie Soft — Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 20px;
    flex-wrap: wrap;
    gap: 12px;
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    margin-left: -20px;
    text-decoration: none;
  }

  .symbol {
    height: 54px;
    width: auto;
    display: block;
    margin-right: -10px;
  }

  .signature {
    height: 108px;
    width: auto;
    display: block;
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item {
    position: relative;
  }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #FFED00;
    text-decoration: none;
    cursor: pointer;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .menu a:hover {
    text-decoration: none;
    color: #FFED00;
  }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: none;
    padding: 0;
    box-shadow: none;
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open {
    display: block;
  }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
    color: #FFED00;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .dropdown a:hover {
    text-decoration: none;
    color: #FFED00;
  }

  /* FULL WIDTH MASONRY GRID */

  .project-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 4px; /* Very tight gap, edge-to-edge feel */
    width: 100%;
    margin: 0;
    padding: 0 0 120px 0;
  }

  .project-item {
    display: block;
    cursor: pointer;
    overflow: hidden;
  }

  .project-item img {
    width: 100%;
    height: auto; /* Allow natural height, no cropping */
    display: block;
    transition: opacity 0.3s ease;
  }

  .project-item:hover img {
    opacity: 0.85;
  }

  /* Custom placement to shuffle and mix sizes */

  .item-butter2 { grid-column: span 7; }
  .item-liesoft2 { grid-column: span 5; }
  .item-castmoss { grid-column: span 4; }
  .item-sinproof { grid-column: span 4; }
  .item-baton { grid-column: span 4; }
  .item-hooked { grid-column: span 5; }
  
  .item-text { grid-column: span 7; display: flex; align-items: center; padding: 20px; background: rgba(0,0,0,0.02); }
  .item-text img { width: 100%; height: auto; object-fit: contain; }

  .item-butter3 { grid-column: span 6; }
  .item-givetake2 { grid-column: span 6; }
  .item-1 { grid-column: span 4; }
  .item-2 { grid-column: span 4; }
  .item-butterfingers { grid-column: span 4; }
  .item-clipped { grid-column: span 5; }
  .item-cushion { grid-column: span 7; }
  .item-givetake { grid-column: span 6; }
  .item-jointpain { grid-column: span 6; }
  .item-cushion2 { grid-column: span 12; } /* Wide bottom */

  /* FULL-SCREEN IMAGE CAROUSEL */

  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(30, 20, 10, 0.92);
    align-items: center;
    justify-content: center;
    z-index: 99999;
    cursor: default;
  }

  .viewer.open {
    display: flex;
  }

  .viewer-stage {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .viewer-stage img {
    height: 66vh;
    width: auto;
    max-width: 78vw;
    object-fit: contain;
    display: block;
    cursor: default;
    user-select: none;
    -webkit-user-drag: none;
  }

  .viewer-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 0;
    border: none;
    background: transparent;
    color: #FFED00;
    font-family: Arial, sans-serif;
    font-size: 60px;
    font-weight: normal;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100001;
    text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
    transition: color 0.2s, transform 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .viewer-arrow:hover {
    color: #ffffff;
    transform: translateY(-50%) scale(1.12);
  }

  .viewer-arrow.prev { left: 6vw; }
  .viewer-arrow.next { right: 6vw; }

  .viewer-counter {
    position: absolute;
    bottom: 18px;
    left: 0;
    width: 100%;
    color: #FFED00;
    text-align: center;
    font: 14px Arial, sans-serif;
    pointer-events: none;
  }

  .copyright {
    position: fixed;
    bottom: 14px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .header { padding: 6px 16px 10px; gap: 8px; }
    .symbol { height: 40px; margin-right: -6px; }
    .signature { height: 60px; }
    .menu { gap: 14px; }
    .menu a { font-size: 14px; }
    .dropdown { min-width: 200px; }
    .dropdown a { font-size: 14px; }

    .project-grid {
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 10px 0 80px 0;
    }

    .project-item, .item-text {
      grid-column: 1 / -1 !important;
    }

    .item-text { padding: 10px; }

    .viewer-stage img {
      height: 55vh;
      max-width: 70vw;
    }

    .viewer-arrow { font-size: 40px; }
    .viewer-arrow.prev { left: 3vw; }
    .viewer-arrow.next { right: 3vw; }

    .viewer-counter { bottom: 14px; font-size: 12px; }
    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html" class="brand">
      <img src="Symbol.png" alt="" class="symbol">
      <img src="my_signature-2-thick.png" alt="Giulia Fassone" class="signature">
    </a>

    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle" href="#projects-dropdown" aria-expanded="false">Projects</a>

        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal-i.html">Ruderal I</a>
          <a href="ruderal-ii.html">Ruderal II</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
        </div>
      </div>

      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="project-grid" id="project-gallery">
    
    <!-- Very large images / Red X marks -->
    <div class="project-item item-butter2">
      <img src="Butter2.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-liesoft2">
      <img src="Lie-Soft2.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-castmoss">
      <img src="Cast-Moss-Fingers.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-sinproof">
      <img src="Sin-Proof-2025.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-baton">
      <img src="Baton-P1100275-1-2.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-hooked">
      <img src="Hooked-stone-thumbnail.png" alt="" class="project-img">
    </div>

    <!-- Text image -->
    <div class="project-item item-text">
      <img src="Lie_soft_text.png" alt="Lie Soft — 2026" class="project-img">
    </div>

    <!-- Remaining images shuffled to fit the grid -->
    <div class="project-item item-butter3">
      <img src="Butter3.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-givetake2">
      <img src="Givetake2.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-1">
      <img src="1.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-2">
      <img src="2.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-butterfingers">
      <img src="Butter-Fingers.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-clipped">
      <img src="ClippedClamped.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-cushion">
      <img src="Cushion.jpg" alt="" class="project-img">
    </div>

    <div class="project-item item-givetake">
      <img src="Givetake.jpg" alt="" class="project-img">

    <div class="project-item item-jointpain">
      <img src="Joint-pain.jpg" alt="" class="project-img">

    <div class="project-item item-cushion2">
      <img src="Cushion-P1100288.jpg" alt="" class="project-img">
    </div>

  </main>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Lie Soft image gallery" aria-hidden="true">
    <button class="viewer-arrow prev" id="viewer-prev" type="button" aria-label="Previous image">&#8249;</button>
    <div class="viewer-stage">
      <img id="viewer-img" src="" alt="">
    </div>
    <button class="viewer-arrow next" id="viewer-next" type="button" aria-label="Next image">&#8250;</button>
    <div class="viewer-counter" id="viewer-counter" aria-live="polite"></div>
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      const isOpen = dropdown.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(isOpen));
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });

    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewer-img');
    const viewerPrev = document.getElementById('viewer-prev');
    const viewerNext = document.getElementById('viewer-next');
    const viewerCounter = document.getElementById('viewer-counter');
    const projectImages = Array.from(document.querySelectorAll('.project-img'));

    let currentIndex = 0;

    function showImage(index) {
      if (projectImages.length === 0) return;
      currentIndex = (index + projectImages.length) % projectImages.length;
      const image = projectImages[currentIndex];
      viewerImg.src = image.src;
      viewerImg.alt = image.alt || 'Lie Soft project image';
      viewerCounter.textContent = `${currentIndex + 1} / ${projectImages.length}`;
    }

    function openViewer(index) {
      showImage(index);
      viewer.classList.add('open');
      viewer.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeViewer() {
      viewer.classList.remove('open');
      viewer.setAttribute('aria-hidden', 'true');
      viewerImg.src = '';
      viewerCounter.textContent = '';
      document.body.style.overflow = '';
    }

    projectImages.forEach((image, index) => {
      image.addEventListener('click', () => openViewer(index));
    });

    viewerPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      showImage(currentIndex - 1);
    });

    viewerNext.addEventListener('click', (e) => {
      e.stopPropagation();
      showImage(currentIndex + 1);
    });

    viewer.addEventListener('click', (e) => {
      if (e.target === viewer) closeViewer();
    });

    document.addEventListener('keydown', (e) => {
      if (!viewer.classList.contains('open')) return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        showImage(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        showImage(currentIndex + 1);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeViewer();
      }
    });
  </script>

</body>
</html>
