<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lie Soft — Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 20px 4px 20px;
    flex-wrap: wrap;
    gap: 12px;
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-left: -20px;
    text-decoration: none;
  }

  .symbol { height: 54px; width: auto; display: block; }

  .signature {
    height: 108px;
    width: auto;
    display: block;
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item { position: relative; }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #FFED00;
    text-decoration: none;
    cursor: pointer;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .menu a:hover {
    text-decoration: none;
    color: #FFED00;
  }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: none;
    padding: 0;
    box-shadow: none;
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open { display: block; }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
    color: #FFED00;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .dropdown a:hover {
    text-decoration: none;
    color: #FFED00;
  }

  .project-text {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin-left: auto;
    margin-right: 6vw;
    margin-top: 12vh;
    padding: 0 20px 80px;
  }

  .project-text img {
    width: 100%;
    height: auto;
    display: block;
  }

  .copyright {
    position: fixed;
    bottom: 14px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .header { padding: 6px 16px 10px; gap: 8px; }
    .symbol { height: 40px; }
    .signature { height: 60px; }
    .menu { gap: 14px; }
    .menu a { font-size: 14px; }
    .dropdown { min-width: 200px; }
    .dropdown a { font-size: 14px; }
    .project-text { margin: 6vh 20px 60px; max-width: 100%; }
    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html" class="brand">
      <img src="Symbol.png" alt="" class="symbol">
      <img src="my_signature-inner-glow.png" alt="Giulia Fassone" class="signature">
    </a>
    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle">Projects</a>
        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal-i.html">Ruderal I</a>
          <a href="ruderal-ii.html">Ruderal II</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
        </div>
      </div>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="project-text">
    <img src="Lie_soft_text.png" alt="Lie Soft — 2026">
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    document.addEventListener('click', (e) => {
      const clickedImg = e.target.closest('img');
      const clickedLink = e.target.closest('a');
      const clickedDropdown = e.target.closest('.dropdown');
      if (!clickedImg && !clickedLink && !clickedDropdown) {
        window.location.href = 'index.html';
      }
    });
  </script>

</body>
</html>
