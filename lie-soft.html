
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lie Soft — Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 20px;
    flex-wrap: wrap;
    gap: 12px;
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    margin-left: -20px;
    text-decoration: none;
  }

  .symbol {
    height: 54px;
    width: auto;
    display: block;
    margin-right: -10px;
  }

  .signature {
    height: 108px;
    width: auto;
    display: block;
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item {
    position: relative;
  }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #FFED00;
    text-decoration: none;
    cursor: pointer;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .menu a:hover {
    text-decoration: none;
    color: #FFED00;
  }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: none;
    padding: 0;
    box-shadow: none;
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open {
    display: block;
  }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
    color: #FFED00;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .dropdown a:hover {
    text-decoration: none;
    color: #FFED00;
  }

  /* PROJECT IMAGE LAYOUT */

  .project {
    position: relative;
    width: 100%;
    min-height: 280vh;
    padding: 0;
  }

  .project .scatter {
    position: absolute;
    cursor: pointer;
    display: block;
    height: auto;
  }

  /* Desktop positions based on your annotated screenshot */

  .img-text { left: 49%; top: 8%; width: 600px; }

  .img-1    { left: 4%;  top: 4%;  width: 238px; }
  .img-2    { left: 14%; top: 14%; width: 250px; }
  .img-3    { left: 22%; top: 25%; width: 224px; }
  .img-4    { left: 16%; top: 33%; width: 266px; }
  .img-5    { left: 5%;  top: 45%; width: 203px; }
  .img-6    { left: 28%; top: 6%;  width: 230px; }
  .img-7    { left: 34%; top: 18%; width: 210px; }
  .img-8    { left: 30%; top: 30%; width: 259px; }
  .img-9    { left: 22%; top: 8%;  width: 260px; }
  .img-10   { left: 39%; top: 26%; width: 238px; }
  .img-11   { left: 72%; top: 9%;  width: 290px; }
  .img-12   { left: 68%; top: 20%; width: 280px; }
  .img-13   { left: 56%; top: 34%; width: 260px; }
  .img-14   { left: 67%; top: 27%; width: 259px; }
  .img-15   { left: 79%; top: 15%; width: 260px; }
  .img-16   { left: 84%; top: 36%; width: 330px; }

  /* FULL-SCREEN IMAGE CAROUSEL */

  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 60px 85px;
    background: rgba(30, 20, 10, 0.92);
    align-items: center;
    justify-content: center;
    z-index: 99999;
    cursor: default;
  }

  .viewer.open {
    display: flex;
  }

  .viewer img {
    max-width: 100%;
    max-height: 85vh;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    cursor: default;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* PREVIOUS AND NEXT ARROWS */

  .viewer-arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: #FFED00;
    color: #5B2C10;
    font-family: Arial, sans-serif;
    font-size: 34px;
    font-weight: normal;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100001;
    transition: background 0.2s, transform 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .viewer-arrow:hover {
    background: #ffffff;
    transform: translateY(-50%) scale(1.08);
  }

  .viewer-arrow:focus-visible,
  .viewer-close:focus-visible {
    outline: 2px solid #ffffff;
    outline-offset: 4px;
  }

  .viewer-prev {
    left: 20px;
  }

  .viewer-next {
    right: 20px;
  }

  /* CLOSE BUTTON */

  .viewer-close {
    position: fixed;
    top: 18px;
    right: 24px;
    width: 44px;
    height: 44px;
    padding: 0;
    border: none;
    background: transparent;
    color: #FFED00;
    font-family: Arial, sans-serif;
    font-size: 38px;
    font-weight: normal;
    line-height: 1;
    cursor: pointer;
    z-index: 100002;
  }

  .viewer-close:hover {
    color: #ffffff;
  }

  /* IMAGE COUNTER */

  .viewer-counter {
    position: fixed;
    bottom: 18px;
    left: 0;
    width: 100%;
    color: #FFED00;
    text-align: center;
    font: 14px Arial, sans-serif;
    pointer-events: none;
  }

  /* COPYRIGHT */

  .copyright {
    position: fixed;
    bottom: 14px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  /* MOBILE LAYOUT */

  @media (max-width: 700px) {
    .header {
      padding: 6px 16px 10px;
      gap: 8px;
    }

    .symbol {
      height: 40px;
      margin-right: -6px;
    }

    .signature {
      height: 60px;
    }

    .menu {
      gap: 14px;
    }

    .menu a {
      font-size: 14px;
    }

    .dropdown {
      min-width: 200px;
    }

    .dropdown a {
      font-size: 14px;
    }

    .project {
      min-height: auto;
      display: flex;
      flex-wrap: wrap;
      padding: 20px 16px 120px;
      gap: 12px;
    }

    .project .scatter {
      position: static;
      width: 45% !important;
      height: auto;
      margin: 4px;
    }

    .viewer {
      padding: 50px 48px;
    }

    .viewer img {
      max-width: calc(100vw - 96px);
      max-height: 80vh;
    }

    .viewer-arrow {
      width: 36px;
      height: 36px;
      font-size: 26px;
    }

    .viewer-prev {
      left: 6px;
    }

    .viewer-next {
      right: 6px;
    }

    .viewer-close {
      top: 12px;
      right: 14px;
      font-size: 32px;
    }

    .viewer-counter {
      bottom: 14px;
      font-size: 12px;
    }

    .copyright {
      font-size: 10px;
    }
  }
</style>
</head>

<body>

  <!-- BACKGROUND -->

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <!-- HEADER AND NAVIGATION -->

  <header class="header">
    <a href="index.html" class="brand">
      <img src="Symbol.png" alt="" class="symbol">
      <img src="my_signature-2-thick.png"
           alt="Giulia Fassone"

    </a>

    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle"
           href="#projects-dropdown"
           aria-expanded="false">Projects</a>

        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal-i.html">Ruderal I</a>

          <a href="fruits-of-labour.html">Fruits of Labour</a>

          <a href="tools.html">Tools</a>

      </div>

      <a href="archive.html">Archive</a>

      <a href="contact.html">Contact</a>

  <!-- PROJECT IMAGE GALLERY -->

  <main class="project" id="project-gallery">

    <img src="Lie_soft_text.png"
         alt="Lie Soft"
         class="project-img scatter img-text">

    <img src="Baton-P1100275-1-2.jpg"
         alt=""
         class="project-img scatter img-1">

    <img src="Butter2.jpg"
         alt=""
         class="project-img scatter img-2">

    <img src="Butter3.jpg"
         alt=""
         class="project-img scatter img-3">

    <img src="Cast-Moss-Fingers.jpg"
         alt=""
         class="project-img scatter img-4">

    <img src="Givetake2.jpg"
         alt=""
         class="project-img scatter img-5">

    <!-- Replaced the blue-circled image -->
    <img src="Hooked-stone-thumbnail.png"
         alt=""
         class="project-img scatter img-6">

    <img src="Lie-Soft2.jpg"
         alt=""
         class="project-img scatter img-7">

    <img src="Sin-Proof-2025.jpg"
         alt=""
         class="project-img scatter img-8">

    <img src="1.jpg"
         alt=""
         class="project-img scatter img-9">

    <img src="2.jpg"
         alt=""
         class="project-img scatter img-10">

    <img src="Butter-Fingers.jpg"
         alt=""
         class="project-img scatter img-11">

    <img src="ClippedClamped.jpg"
         alt=""
         class="project-img scatter img-12">

    <img src="Cushion.jpg"
         alt=""
         class="project-img scatter img-13">

    <img src="Givetake.jpg"
         alt=""
         class="project-img scatter img-14">

    <img src="Joint-pain.jpg"
         alt=""
         class="project-img scatter img-15">

    <img src="Cushion-P1100288.jpg"
         alt=""
         class="project-img scatter img-16">

  </main>

  <!-- FULL-SCREEN IMAGE CAROUSEL -->

  <div class="viewer"
       id="viewer"
       role="dialog"
       aria-modal="true"
       aria-label="Lie Soft image gallery"
       aria-hidden="true">

    <button class="viewer-close"
            id="viewer-close"
            type="button"
            aria-label="Close gallery">&times;</button>

    <button class="viewer-arrow viewer-prev"
            id="viewer-prev"
            type="button"
            aria-label="Previous image">&#8249;</button>

    <img id="viewer-img" src="" alt="">

    <button class="viewer-arrow viewer-next"
            id="viewer-next"
            type="button"
            aria-label="Next image">&#8250;</button>

    <div class="viewer-counter"
         id="viewer-counter"
         aria-live="polite"></div>

  </div>

  <div class="copyright">
    © Giulia Fassone 2026. All rights reserved.
  </div>

  <script>
    /* PROJECTS DROPDOWN */

    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();

      const isOpen = dropdown.classList.toggle('open');
      toggle.setAttribute('aria-expanded', String(isOpen));
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) &&
          !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });


    /* IMAGE CAROUSEL */

    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewer-img');
    const viewerPrev = document.getElementById('viewer-prev');
    const viewerNext = document.getElementById('viewer-next');
    const viewerClose = document.getElementById('viewer-close');
    const viewerCounter = document.getElementById('viewer-counter');

    const projectImages = Array.from(
      document.querySelectorAll('.project-img')
    );

    let currentIndex = 0;
    let previouslyFocusedElement = null;

    /* Display the image at the requested index. */

    function showImage(index) {
      if (projectImages.length === 0) return;

      currentIndex =
        (index + projectImages.length) % projectImages.length;

      const image = projectImages[currentIndex];

      viewerImg.src = image.src;
      viewerImg.alt = image.alt || 'Lie Soft project image';

      viewerCounter.textContent =
        `${currentIndex + 1} / ${projectImages.length}`;
    }

    /* Open the carousel on the image that was clicked. */

    function openViewer(index) {
      previouslyFocusedElement = document.activeElement;

      showImage(index);

      viewer.classList.add('open');
      viewer.setAttribute('aria-hidden', 'false');

      document.body.style.overflow = 'hidden';

      viewerClose.focus();
    }

    /* Close the carousel and restore the page. */

    function closeViewer() {
      viewer.classList.remove('open');
      viewer.setAttribute('aria-hidden', 'true');

      viewerImg.src = '';
      viewerCounter.textContent = '';

      document.body.style.overflow = '';

      if (previouslyFocusedElement &&
          typeof previouslyFocusedElement.focus === 'function') {
        previouslyFocusedElement.focus();
      }
    }

    /* Make every project image clickable. */

    projectImages.forEach((image, index) => {
      image.addEventListener('click', () => {
        openViewer(index);
      });
    });

    /* Previous image. */

    viewerPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      showImage(currentIndex - 1);
    });

    /* Next image. */

    viewerNext.addEventListener('click', (e) => {
      e.stopPropagation();
      showImage(currentIndex + 1);
    });

    /* Close button. */

    viewerClose.addEventListener('click', (e) => {
      e.stopPropagation();
      closeViewer();
    });

    /* Clicking the dark background closes the carousel. */

    viewer.addEventListener('click', (e) => {
      if (e.target === viewer) {
        closeViewer();
      }
    });

    /* Keyboard navigation. */

    document.addEventListener('keydown', (e) => {
      if (!viewer.classList.contains('open')) return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        showImage(currentIndex - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        showImage(currentIndex + 1);
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeViewer();
      }
    });
  </script>

</body>
</html>
