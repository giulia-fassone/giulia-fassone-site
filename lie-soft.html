<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lie Soft — Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 20px 4px 20px;
    flex-wrap: wrap;
    gap: 12px;
    position: relative;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    margin-left: -20px;
    text-decoration: none;
  }

  .symbol { height: 54px; width: auto; display: block; margin-right: -10px; }

  .signature { height: 108px; width: auto; display: block; }

  .menu { display: flex; gap: 28px; align-items: baseline; }

  .menu-item { position: relative; }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #FFED00;
    text-decoration: none;
    cursor: pointer;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .menu a:hover { text-decoration: none; color: #FFED00; }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: none;
    padding: 0;
    box-shadow: none;
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open { display: block; }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
    color: #FFED00;
    text-shadow: 2px 2px 6px #5454E5;
  }

  .dropdown a:hover { text-decoration: none; color: #FFED00; }

  .project {
    position: relative;
    width: 100%;
    min-height: 280vh;
    padding: 0;
  }

  .project .scatter {
    position: absolute;
    cursor: pointer;
    display: block;
  }

  .img-text { left: 50%; top: 5%; width: 460px; }
  .img-2  { left: 14%; top: 14%;  width: 250px; }
  .img-6  { left: 28%; top: 6%;   width: 230px; }
  .img-9  { left: 26%; top: 44%;  width: 260px; }
  .img-11 { left: 60%; top: 8%;   width: 290px; }
  .img-13 { left: 56%; top: 34%;  width: 260px; }
  .img-15 { left: 80%; top: 18%;  width: 260px; }
  .img-16 { left: 84%; top: 36%;  width: 330px; }
  .img-1  { left: 4%;  top: 4%;   width: 238px; }
  .img-3  { left: 2%;  top: 25%;  width: 224px; }
  .img-4  { left: 16%; top: 33%;  width: 266px; }
  .img-5  { left: 5%;  top: 45%;  width: 203px; }
  .img-7  { left: 34%; top: 18%;  width: 210px; }
  .img-8  { left: 30%; top: 30%;  width: 259px; }
  .img-10 { left: 20%; top: 55%;  width: 238px; }
  .img-12 { left: 68%; top: 20%;  width: 280px; }
  .img-14 { left: 63%; top: 46%;  width: 259px; }

  /* Simple viewer */
  .viewer {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(30, 20, 10, 0.9);
    align-items: center;
    justify-content: center;
    z-index: 99999;
    cursor: pointer;
  }

  .viewer.open { display: flex; }

  .viewer img {
    max-width: 85vw;
    max-height: 85vh;
    display: block;
  }

  .copyright {
    position: fixed;
    bottom: 14px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .header { padding: 6px 16px 10px; gap: 8px; }
    .symbol { height: 40px; margin-right: -6px; }
    .signature { height: 60px; }
    .menu { gap: 14px; }
    .menu a { font-size: 14px; }
    .dropdown { min-width: 200px; }
    .dropdown a { font-size: 14px; }

    .project {
      min-height: auto;
      display: flex;
      flex-wrap: wrap;
      padding: 20px 16px 120px;
      gap: 12px;
    }

    .project .scatter {
      position: static;
      width: 45% !important;
      margin: 4px;
    }

    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html" class="brand">
      <img src="Symbol.png" alt="" class="symbol">
      <img src="my_signature-2-thick.png" alt="Giulia Fassone" class="signature">
    </a>
    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle">Projects</a>
        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal-i.html">Ruderal I</a>
          <a href="ruderal-ii.html">Ruderal II</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
        </div>
      </div>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="project">
    <img src="Lie_soft_text.png" alt="" class="project-img scatter img-text">
    <img src="Baton-P1100275-1-2.jpg" alt="" class="project-img scatter img-1">
    <img src="Butter2.jpg" alt="" class="project-img scatter img-2">
    <img src="Butter3.jpg" alt="" class="project-img scatter img-3">
    <img src="Cast-Moss-Fingers.jpg" alt="" class="project-img scatter img-4">
    <img src="Givetake2.jpg" alt="" class="project-img scatter img-5">
    <img src="Hooked2.jpg" alt="" class="project-img scatter img-6">
    <img src="Lie-Soft2.jpg" alt="" class="project-img scatter img-7">
    <img src="Sin-Proof-2025.jpg" alt="" class="project-img scatter img-8">
    <img src="1.jpg" alt="" class="project-img scatter img-9">
    <img src="2.jpg" alt="" class="project-img scatter img-10">
    <img src="Butter-Fingers.jpg" alt="" class="project-img scatter img-11">
    <img src="ClippedClamped.jpg" alt="" class="project-img scatter img-12">
    <img src="Cushion.jpg" alt="" class="project-img scatter img-13">
    <img src="Givetake.jpg" alt="" class="project-img scatter img-14">
    <img src="Joint-pain.jpg" alt="" class="project-img scatter img-15">
    <img src="Cushion-P1100288.jpg" alt="" class="project-img scatter img-16">
  </div>

  <div class="viewer" id="viewer">
    <img id="viewer-img" src="" alt="">
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });

    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewer-img');
    const projectImages = document.querySelectorAll('.project-img');

    projectImages.forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        viewerImg.src = img.src;
        viewer.classList.add('open');
      });
    });

    viewer.addEventListener('click', () => {
      viewer.classList.remove('open');
      viewerImg.src = '';
    });
  </script>

</body>
</html>
