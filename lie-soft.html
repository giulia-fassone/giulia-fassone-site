
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5B2C10">
<title>Lie Soft — Giulia Fassone</title>

<style>
@font-face {
  font-family: 'TaylorGothic';
  src: url('Taylor-Gothic.woff2') format('woff2'),
       url('Taylor-Gothic.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}

:root {
  --page-margin: 0.5in;
  --grid-gap: 18px;
  --grid-row: 8px;
  --text-colour: #5B2C10;
  --yellow: #FFED00;
}

* {
  box-sizing: border-box;
}

html,body{margin:0;padding:0;min-height:100%;background:#f5f2e9}

body {
  font-family: Arial, sans-serif;
  color: var(--text-colour);
}

/* BACKGROUND */

.bg,.overlay{display:none}
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 20px;
  flex-wrap: wrap;
  gap: 12px;
  position: relative;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  margin-left: -20px;
  text-decoration: none;
}

.symbol {
  height: 54px;
  width: auto;
  display: block;
  margin-right: -10px;
}

.signature {
  height: 108px;
  width: auto;
  display: block;
}

.menu {
  display: flex;
  gap: 28px;
  align-items: baseline;
}

.menu-item {
  position: relative;
}

.menu a { font-family:Arial,sans-serif; font-size:20px; color:var(--text-colour); text-decoration:none; cursor:pointer; text-shadow:none; }

.menu a:hover {
  color: var(--yellow);
}

.dropdown {
  display: none; position: absolute; top: 100%; left: 0; margin-top: 10px; min-width: 240px; z-index: 20;
}

.dropdown.open {
  display: block;
}

.dropdown a {
  display: block;
  font-size: 18px;
  padding: 6px 0;
  white-space: nowrap;
}

/* PROJECT GALLERY */

.project-grid{display:block;column-count:3;column-gap:18px;max-width:1600px;width:100%;padding:0.5in;margin:0 auto 100px;column-fill:balance}
.project-item{display:inline-block;vertical-align:top;width:100%;break-inside:avoid;min-width:0;margin:0 0 18px;padding:0;cursor:zoom-in}
.project-item img{display:block;width:100%;max-width:100%;height:auto;object-fit:contain;margin:0}
.project-item:nth-child(5n + 2) img{width:78%;max-width:78%;margin-left:0}
.project-item:nth-child(5n + 3) img{width:88%;max-width:88%;margin-left:auto;margin-right:0}
.project-item:nth-child(5n + 4) img{width:68%;max-width:68%;margin-left:16%;margin-right:auto}
.project-item:nth-child(5n) img{width:92%;max-width:92%;margin-left:auto;margin-right:0}
/* Text-bearing images must be legible at a glance */
.project-item.item-text{width:100%;column-span:all;break-inside:avoid;margin:18px 0}
.project-item.item-text img{display:block;width:125%;max-width:125%;height:auto;margin:-34px auto 0;position:relative;left:-12.5%}
.span-2 img{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important}
.project-item.enlarge img{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important}
.viewer {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 60px 90px;
  background: rgba(30, 20, 10, 0.94);
  align-items: center;
  justify-content: center;
  z-index: 99999;
  cursor: zoom-out;
}

.viewer.open {
  display: flex;
}

.viewer-stage {
  display: flex;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  cursor: default;
}

.viewer-stage img {
  display: block;
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 78vh;
  object-fit: contain;
  cursor: default;
  user-select: none;
  -webkit-user-drag: none;
}

/* VIEWER ARROWS */

.viewer-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 56px;
  padding: 0;
  border: 0;
  border-radius: 0;
  outline: none;
  box-shadow: none;
  appearance: none;
  background: transparent !important;
  color: var(--yellow);
  cursor: pointer;
  z-index: 100001;
  opacity: 0.8;
  transition: opacity 0.2s ease;
}

.viewer-arrow svg {
  display: block;
  width: 23px;
  height: 38px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.15;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.viewer-arrow:hover {
  opacity: 1;
  transform: translateY(-50%);
  color: var(--yellow);
  background: transparent !important;
  box-shadow: none;
}

.viewer-arrow.prev {
  left: 24px;
}

.viewer-arrow.next {
  right: 24px;
}

.viewer-counter {
  position: absolute;
  bottom: 18px;
  left: 0;
  width: 100%;
  color: var(--yellow);
  text-align: center;
  font: 14px Arial, sans-serif;
  pointer-events: none;
}

.viewer button:focus-visible {
  outline: none;
  box-shadow: none;
}

/* COPYRIGHT */

.copyright {
  position: fixed;
  bottom: 14px;
  left: 0;
  width: 100%;
  text-align: center;
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: var(--text-colour);
  z-index: 5;
  pointer-events: none;
}

/* TABLET */

@media (min-width: 701px) and (max-width: 1100px) {
  :root {
    --grid-gap: 14px;
    --page-margin: 18px;
  }

  .project-grid{column-count:3}
}

/* MOBILE */

@media (max-width: 700px) {
  :root {
    --grid-gap: 12px;
    --page-margin: 12px;
  }

  .header {
    padding: 6px 16px 10px;
    gap: 8px;
  }

  .symbol {
    height: 40px;
    margin-right: -6px;
  }

  .signature {
    height: 60px;
  }

  .menu {
    gap: 14px;
  }

  .menu a {
    font-size: 14px;
  }

  .dropdown {
    min-width: 200px;
  }

  .dropdown a {
    font-size: 14px;
  }

  .project-grid{column-count:2;padding-bottom:80px;column-gap:18px}

  .span-2,.item-text{grid-column:auto}

  .viewer {
    padding: 50px 42px;
  }

  .viewer-stage img {
    max-width: 100%;
    max-height: 72vh;
  }

  .viewer-arrow {
    width: 28px;
    height: 46px;
  }

  .viewer-arrow svg {
    width: 18px;
    height: 30px;
  }

  .viewer-arrow.prev {
    left: 2px;
  }

  .viewer-arrow.next {
    right: 2px;
  }

  .viewer-counter {
    bottom: 14px;
    font-size: 12px;
  }

  .copyright {
    font-size: 10px;
  }
}

/* Soft, frosted dropdown menu */
.dropdown {
  background: rgba(245, 242, 233, 0.68) !important;
  -webkit-backdrop-filter: blur(16px) saturate(115%);
  backdrop-filter: blur(16px) saturate(115%);
  border: 1px solid rgba(91, 44, 16, 0.07);
  border-radius: 8px;
  padding: 8px 14px !important;
  box-shadow: 0 5px 18px rgba(30, 20, 10, 0.045) !important;
  overflow: hidden;
}
.dropdown a { padding: 6px 0; }


/* Targeted size adjustments for the requested Lie Soft images */
.project-item:has(img[src="optimized/Cast-Moss-Fingers.webp"]) img,
.project-item:has(img[src="optimized/Givetake2.webp"]) img,
.project-item:has(img[src="optimized/ClippedClamped.webp"]) img { width:100% !important; max-width:100% !important; margin-left:0 !important; margin-right:0 !important; }
</style>
</head>

<script>
/* PROJECTS DROPDOWN */

const toggle = document.getElementById('projects-toggle');
const dropdown = document.getElementById('projects-dropdown');

toggle.addEventListener('click', (e) => {
  e.preventDefault();

  const isOpen = dropdown.classList.toggle('open');
  toggle.setAttribute('aria-expanded', String(isOpen));
});

document.addEventListener('click', (e) => {
  if (!toggle.contains(e.target) &&
      !dropdown.contains(e.target)) {
    dropdown.classList.remove('open');
    toggle.setAttribute('aria-expanded', 'false');
  }
});

/* DENSE GRID LAYOUT */

const gallery = document.getElementById('project-gallery');

function packGallery() {
  if (!gallery) return;

  const styles = getComputedStyle(gallery);
  const rowHeight =
    parseFloat(styles.getPropertyValue('--grid-row')) || 8;
  const rowGap = parseFloat(styles.rowGap) || 0;

  gallery.querySelectorAll('.project-item').forEach(item => {
    item.style.gridRowEnd = 'auto';
  });

  requestAnimationFrame(() => {
    gallery.querySelectorAll('.project-item').forEach(item => {
      const height = item.getBoundingClientRect().height;

      const rows = Math.ceil(
        (height + rowGap) / (rowHeight + rowGap)
      );

      item.style.gridRowEnd = `span ${rows}`;
    });
  });
}

gallery.querySelectorAll('img').forEach(img => {
  if (img.complete && img.naturalWidth > 0) {
    packGallery();
  } else {
    img.addEventListener('load', packGallery, { once: true });
    img.addEventListener('error', packGallery, { once: true });
  }
});

window.addEventListener('resize', packGallery);
window.addEventListener('load', packGallery);

/* IMAGE VIEWER */

const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewer-img');
const viewerPrev = document.getElementById('viewer-prev');
const viewerNext = document.getElementById('viewer-next');
const viewerCounter = document.getElementById('viewer-counter');

const projectImages = Array.from(
  document.querySelectorAll('.project-img:not([data-no-viewer="true"])')
);

let currentIndex = 0;
let previouslyFocusedElement = null;

function showImage(index) {
  if (projectImages.length === 0) return;

  currentIndex =
    (index + projectImages.length) % projectImages.length;

  const image = projectImages[currentIndex];

  viewerImg.src = image.currentSrc || image.src;
  viewerImg.alt = image.alt || 'Lie Soft project image';

  viewerCounter.textContent =
    `${currentIndex + 1} / ${projectImages.length}`;
}

function openViewer(index) {
  previouslyFocusedElement = document.activeElement;

  showImage(index);

  viewer.classList.add('open');
  viewer.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';

  viewerNext.focus();
}

function closeViewer() {
  viewer.classList.remove('open');
  viewer.setAttribute('aria-hidden', 'true');

  viewerImg.src = '';
  viewerCounter.textContent = '';

  document.body.style.overflow = '';

  if (previouslyFocusedElement &&
      typeof previouslyFocusedElement.focus === 'function') {
    previouslyFocusedElement.focus();
  }
}

projectImages.forEach((image, index) => {
  image.addEventListener('click', () => {
    openViewer(index);
  });
});

viewerPrev.addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex - 1);
});

viewerNext.addEventListener('click', (e) => {
  e.stopPropagation();
  showImage(currentIndex + 1);
});

/* Click the dark background to close */

viewer.addEventListener('click', (e) => {
  if (e.target === viewer) {
    closeViewer();
  }
});

/* Keyboard controls */

document.addEventListener('keydown', (e) => {
  if (!viewer.classList.contains('open')) return;

  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    showImage(currentIndex - 1);
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    showImage(currentIndex + 1);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closeViewer();
  }
});
</script>
