<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lie Soft — Giulia Fassone</title>

<style>
  @font-face {
    font-family: 'TaylorGothic';
    src: url('Taylor-Gothic.woff2') format('woff2'),
         url('Taylor-Gothic.woff') format('woff');
    font-weight: normal;
    font-style: normal;
  }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
    color: #5B2C10;
  }

  .bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -2;
    overflow: hidden;
  }

  .bg img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(120, 140, 210, 0.4);
    z-index: -1;
    pointer-events: none;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 28px 40px;
    flex-wrap: wrap;
    gap: 16px;
    position: relative;
    z-index: 10;
  }

  .signature {
    display: block;
    height: 40px;
    width: auto;
    text-decoration: none;
  }

  .menu {
    display: flex;
    gap: 28px;
    align-items: baseline;
  }

  .menu-item {
    position: relative;
  }

  .menu a {
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #5B2C10;
    text-decoration: none;
    cursor: pointer;
  }

  .menu a:hover { text-decoration: underline; }

  .dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 10px;
    background: rgba(245, 240, 230, 0.95);
    backdrop-filter: blur(4px);
    padding: 16px 22px;
    box-shadow: 2px 2px 10px rgba(90, 60, 30, 0.15);
    min-width: 240px;
    z-index: 20;
  }

  .dropdown.open { display: block; }

  .dropdown a {
    display: block;
    font-size: 18px;
    padding: 6px 0;
    white-space: nowrap;
  }

  .dropdown a:hover { text-decoration: underline; }

  .project-text {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin-left: auto;
    margin-right: 6vw;
    margin-top: 12vh;
    padding: 0 20px 80px;
  }

  .project-text img {
    width: 100%;
    height: auto;
    display: block;
    box-shadow: 3px 3px 20px rgba(60, 40, 20, 0.25);
  }

  .copyright {
    position: fixed;
    bottom: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    color: #5B2C10;
    z-index: 1;
    pointer-events: none;
  }

  @media (max-width: 700px) {
    .header { padding: 20px 20px; gap: 12px; }
    .signature { height: 28px; }
    .menu { gap: 16px; }
    .menu a { font-size: 15px; }
    .dropdown { min-width: 200px; padding: 12px 16px; }
    .dropdown a { font-size: 15px; }
    .project-text { margin-right: 20px; margin-left: 20px; margin-top: 6vh; max-width: 100%; }
    .copyright { font-size: 10px; }
  }
</style>
</head>

<body>

  <div class="bg">
    <img src="P10907.jpg" alt="">
  </div>

  <div class="overlay"></div>

  <header class="header">
    <a href="index.html" class="signature-link">
      <img src="my_signature.png" alt="Giulia Fassone" class="signature">
    </a>
    <nav class="menu">
      <div class="menu-item">
        <a id="projects-toggle">Projects</a>
        <div class="dropdown" id="projects-dropdown">
          <a href="appetite.html">Appetite</a>
          <a href="lie-soft.html">Lie Soft</a>
          <a href="archaeology-of-self.html">Archaeology Of Self</a>
          <a href="ruderal.html">Ruderal</a>
          <a href="fruits-of-labour.html">Fruits of Labour</a>
          <a href="the-remains-of-a-meal.html">The Remains Of A Meal</a>
          <a href="tools.html">Tools</a>
        </div>
      </div>
      <a href="index.html">Home</a>
      <a href="archive.html">Archive</a>
      <a href="cv.html">CV</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="project-text">
    <img src="Lie_soft_text.png" alt="Lie Soft — 2026">
  </div>

  <div class="copyright">© Giulia Fassone 2026. All rights reserved.</div>

  <script>
    const toggle = document.getElementById('projects-toggle');
    const dropdown = document.getElementById('projects-dropdown');

    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      dropdown.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!toggle.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove('open');
      }
    });
  </script>

</body>
</html>
