<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5B2C10"><title>Sketchbook — Giulia Fassone</title><style>
@font-face{font-family:TaylorGothic;src:url('Taylor-Gothic.woff2') format('woff2'),url('Taylor-Gothic.woff') format('woff')}
:root{--text:#5B2C10;--yellow:#FFED00;--paper:#f3efe4;--gap:26px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f2e9}body{font-family:Arial,sans-serif;color:var(--text);background-color:#b4a8b5;background-image:linear-gradient(rgba(180,168,181,.96),rgba(180,168,181,.96)),url('originals/ruderal-ii/texture-2.jpg');background-position:center,center;background-size:auto,cover;background-attachment:fixed,fixed}
.bg,.overlay{display:none}
.header{display:flex;align-items:center;justify-content:space-between;padding:4px 20px;flex-wrap:wrap;gap:12px;position:relative;z-index:10}.brand{display:flex;align-items:center;margin-left:-20px;text-decoration:none}.symbol{height:54px;width:auto;display:block;margin-right:-10px}.signature{height:108px;width:auto;display:block}.menu{display:flex;gap:28px;align-items:baseline}.menu-item{position:relative}.menu a{font-size:20px;color:var(--text);text-decoration:none;text-shadow:none;cursor:pointer}.dropdown{display:none;position:absolute;top:100%;left:0;margin-top:10px;min-width:240px;z-index:20}.dropdown.open{display:block}.dropdown a{display:block;font-size:18px;padding:6px 0;white-space:nowrap}
.sketch-intro{padding:0 4.5vw 20px;display:flex;align-items:baseline;gap:22px}.sketch-intro h1{font-size:clamp(24px,3vw,42px);font-weight:400;margin:0}.sketch-intro p{font-size:13px;max-width:360px;margin:0;line-height:1.45}
.sketch-sheet{max-width:1500px;margin:0 auto 100px;padding:14px 4.5vw 50px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:26px}.sheet-item{margin:0;min-width:0;cursor:zoom-in}.sheet-item img{display:block;width:100%;height:auto;object-fit:contain}
.viewer{display:none;position:fixed;inset:0;padding:55px 80px;background:rgba(30,20,10,.94);align-items:center;justify-content:center;z-index:99999}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:82vh;object-fit:contain}.viewer-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:56px;border:0;background:transparent;color:var(--yellow);cursor:pointer}.viewer-arrow svg{width:23px;height:38px;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}.prev{left:24px}.next{right:24px}.counter{position:absolute;bottom:18px;color:var(--yellow);font:14px Arial,sans-serif}.copyright{position:fixed;bottom:14px;left:0;width:100%;text-align:center;font:12px Arial,sans-serif;color:var(--text);pointer-events:none}
@media(max-width:850px){:root{--gap:16px}.sketch-sheet{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 18px 50px;gap:20px}.sketch-intro{padding:0 18px 16px;display:block}.sketch-intro p{margin-top:6px}}
@media(max-width:700px){.header{padding:6px 16px 10px;gap:8px}.symbol{height:40px;margin-right:-6px}.signature{height:60px}.menu{gap:14px}.menu a{font-size:14px}.dropdown{min-width:200px}.dropdown a{font-size:14px}.sketch-sheet{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding:12px 12px 80px}.viewer{padding:50px 42px}.prev{left:2px}.next{right:2px}.copyright{font-size:10px}}

/* Soft, frosted dropdown menu */
.dropdown {
  background: rgba(245, 242, 233, 0.68) !important;
  -webkit-backdrop-filter: blur(16px) saturate(115%);
  backdrop-filter: blur(16px) saturate(115%);
  border: 1px solid rgba(91, 44, 16, 0.07);
  border-radius: 8px;
  padding: 8px 14px !important;
  box-shadow: 0 5px 18px rgba(30, 20, 10, 0.045) !important;
  overflow: hidden;
}
.dropdown a { padding: 6px 0; }


</style></head><body>

<section class="sketch-intro"><h1>Sketchbook</h1><p>Studies, fragments and working notes — a record of things in progress.</p></section><main class="sketch-sheet"><figure class="sheet-item"><img class="sketch-img" src="optimized/sketchbook/3125ECAC-69FA-47A9-974E-589AC83A1E5F_result.webp" alt="Sketchbook page 1" loading="eager" decoding="async"></figure>

<figure class="sheet-item"><img class="sketch-img" src="optimized/sketchbook/A2F62B49-CE3F-408C-90D0-A68759F3BB62_result.webp" alt="Sketchbook page 3" loading="eager" decoding="async"></figure>

<script>
const toggle=document.getElementById('projects-toggle'),dropdown=document.getElementById('projects-dropdown');toggle.addEventListener('click',e=>{e.preventDefault();const open=dropdown.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));});document.addEventListener('click',e=>{if(!toggle.contains(e.target)&&!dropdown.contains(e.target)){dropdown.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
const imgs=[...document.querySelectorAll('.sketch-img')],viewer=document.getElementById('viewer'),large=document.getElementById('viewer-img'),counter=document.getElementById('counter');let current=0;function show(i){current=(i+imgs.length)%imgs.length;large.src=imgs[current].src;large.alt=imgs[current].alt;counter.textContent=(current+1)+' / '+imgs.length}imgs.forEach((im,i)=>im.addEventListener('click',()=>{show(i);viewer.classList.add('open');viewer.setAttribute('aria-hidden','false')}));document.getElementById('prev').onclick=e=>{e.stopPropagation();show(current-1)};document.getElementById('next').onclick=e=>{e.stopPropagation();show(current+1)};viewer.onclick=e=>{if(!e.target.closest('.viewer img, .viewer-arrow')){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}};document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape'){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
</script></body></html>
