<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5B2C10"><title>Sketchbook — Giulia Fassone</title><style>
@font-face{font-family:TaylorGothic;src:url('Taylor-Gothic.woff2') format('woff2'),url('Taylor-Gothic.woff') format('woff')}
:root{--text:#5B2C10;--yellow:#FFED00;--paper:#f3efe4;--gap:26px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent}body{font-family:Arial,sans-serif;color:var(--text)}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}.bg img{width:100%;height:100%;object-fit:cover;object-position:center bottom}.overlay{position:fixed;inset:0;background:rgba(120,140,210,.4);z-index:-1;pointer-events:none}
.header{display:flex;align-items:center;justify-content:space-between;padding:4px 20px;flex-wrap:wrap;gap:12px;position:relative;z-index:10}.brand{display:flex;align-items:center;margin-left:-20px;text-decoration:none}.symbol{height:54px;width:auto;display:block;margin-right:-10px}.signature{height:108px;width:auto;display:block}.menu{display:flex;gap:28px;align-items:baseline}.menu-item{position:relative}.menu a{font-size:20px;color:var(--yellow);text-decoration:none;text-shadow:2px 2px 6px #5454E5;cursor:pointer}.dropdown{display:none;position:absolute;top:100%;left:0;margin-top:10px;min-width:240px;z-index:20}.dropdown.open{display:block}.dropdown a{display:block;font-size:18px;padding:6px 0;white-space:nowrap}
.sketch-intro{padding:0 4.5vw 20px;display:flex;align-items:baseline;gap:22px}.sketch-intro h1{font-size:clamp(24px,3vw,42px);font-weight:400;margin:0}.sketch-intro p{font-size:13px;max-width:360px;margin:0;line-height:1.45}
.sketch-sheet{max-width:1500px;margin:0 auto 100px;padding:14px 4.5vw 50px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-items:start;column-gap:var(--gap);row-gap:42px}.sheet-item{margin:0;min-width:0;position:relative;padding:10px 10px 26px;background:var(--paper);box-shadow:0 2px 8px rgba(30,20,10,.12);cursor:zoom-in}.sheet-item img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}.sheet-item figcaption{position:absolute;bottom:7px;right:10px;font:10px Arial,sans-serif;opacity:.7}.sheet-item:nth-child(6n+1){grid-column:span 5;transform:rotate(-1.2deg);margin-top:14px}.sheet-item:nth-child(6n+2){grid-column:span 3;transform:rotate(1.5deg);margin-top:70px}.sheet-item:nth-child(6n+3){grid-column:span 4;transform:rotate(-.6deg);margin-top:0}.sheet-item:nth-child(6n+4){grid-column:2 / span 4;transform:rotate(1.2deg);margin-top:20px}.sheet-item:nth-child(6n+5){grid-column:span 3;transform:rotate(-1.8deg);margin-top:80px}.sheet-item:nth-child(6n){grid-column:span 4;transform:rotate(.7deg);margin-top:10px}
.sheet-item:hover{z-index:2;transform:rotate(0) scale(1.015)}.viewer{display:none;position:fixed;inset:0;padding:55px 80px;background:rgba(30,20,10,.94);align-items:center;justify-content:center;z-index:99999}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:82vh;object-fit:contain}.viewer-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:56px;border:0;background:transparent;color:var(--yellow);cursor:pointer}.viewer-arrow svg{width:23px;height:38px;fill:none;stroke:currentColor;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}.prev{left:24px}.next{right:24px}.counter{position:absolute;bottom:18px;color:var(--yellow);font:14px Arial,sans-serif}.copyright{position:fixed;bottom:14px;left:0;width:100%;text-align:center;font:12px Arial,sans-serif;color:var(--text);pointer-events:none}
@media(max-width:850px){:root{--gap:16px}.sketch-sheet{padding-inline:18px;row-gap:26px}.sheet-item:nth-child(n){grid-column:span 6;margin-top:0}.sheet-item:nth-child(odd){transform:rotate(-.8deg)}.sheet-item:nth-child(even){transform:rotate(.8deg)}.sketch-intro{padding:0 18px 16px;display:block}.sketch-intro p{margin-top:6px}}
@media(max-width:700px){.header{padding:6px 16px 10px;gap:8px}.symbol{height:40px;margin-right:-6px}.signature{height:60px}.menu{gap:14px}.menu a{font-size:14px}.dropdown{min-width:200px}.dropdown a{font-size:14px}.sketch-sheet{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px;padding:12px 12px 80px}.sheet-item:nth-child(n){grid-column:span 1;padding:6px 6px 22px;margin-top:0}.sheet-item img{max-height:none}.viewer{padding:50px 42px}.prev{left:2px}.next{right:2px}.copyright{font-size:10px}}
</style></head><body><div class="bg"><img src="P10907.jpg" alt=""></div><div class="overlay"></div>

<script>
const toggle=document.getElementById('projects-toggle'),dropdown=document.getElementById('projects-dropdown');toggle.addEventListener('click',e=>{e.preventDefault();const open=dropdown.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));});document.addEventListener('click',e=>{if(!toggle.contains(e.target)&&!dropdown.contains(e.target)){dropdown.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
const imgs=[...document.querySelectorAll('.sketch-img')],viewer=document.getElementById('viewer'),large=document.getElementById('viewer-img'),counter=document.getElementById('counter');let current=0;function show(i){current=(i+imgs.length)%imgs.length;large.src=imgs[current].src;large.alt=imgs[current].alt;counter.textContent=(current+1)+' / '+imgs.length}imgs.forEach((im,i)=>im.addEventListener('click',()=>{show(i);viewer.classList.add('open');viewer.setAttribute('aria-hidden','false')}));document.getElementById('prev').onclick=e=>{e.stopPropagation();show(current-1)};document.getElementById('next').onclick=e=>{e.stopPropagation();show(current+1)};viewer.onclick=e=>{if(e.target===viewer){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}};document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape'){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true')}if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1)});
</script></body></html>
