<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5B2C10"><title>Sketchbook — Giulia Fassone</title><style>
@font-face{font-family:TaylorGothic;src:url('Taylor-Gothic.woff2') format('woff2'),url('Taylor-Gothic.woff') format('woff')}
:root{--text:#5B2C10;--yellow:#FFED00;--paper:#f3efe4;--gap:26px}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f5f2e9}body{font-family:Arial,sans-serif;color:var(--text);background-color:#b4a8b5;background-image:linear-gradient(rgba(180,168,181,.96),rgba(180,168,181,.96)),url('originals/ruderal-ii/texture-2.jpg');background-position:center,center;background-size:auto,cover;background-attachment:fixed,fixed}
.bg,.overlay{display:none}
.header{display:flex;align-items:center;justify-content:space-between;padding:4px 20px;flex-wrap:wrap;gap:12px;position:relative;z-index:10}.brand{display:flex;align-items:center;margin-left:-20px;text-decoration:none}.symbol{height:54px;width:auto;display:block;margin-right:-10px}.signature{height:108px;width:auto;display:block}.menu{display:flex;gap:28px;align-items:baseline}.menu-item{position:relative}.menu a{font-size:20px;color:var(--text);text-decoration:none;text-shadow:none;cursor:pointer}.dropdown{display:none;position:absolute;top:100%;left:0;margin-top:10px;min-width:240px;z-index:20}.dropdown.open{display:block}.dropdown a{display:block;font-size:18px;padding:6px 0;white-space:nowrap}
.copyright{position:fixed;bottom:14px;left:0;width:100%;text-align:center;font:12px Arial,sans-serif;color:var(--text);pointer-events:none}
@media(max-width:850px){:root{--gap:16px}}
@media(max-width:700px){.header{padding:6px 16px 10px;gap:8px}.symbol{height:40px;margin-right:-6px}.signature{height:60px}.menu{gap:14px}.menu a{font-size:14px}.dropdown{min-width:200px}.dropdown a{font-size:14px}.copyright{font-size:10px}}

/* Soft, frosted dropdown menu */
.dropdown {
  background: rgba(245, 242, 233, 0.68) !important;
  -webkit-backdrop-filter: blur(16px) saturate(115%);
  backdrop-filter: blur(16px) saturate(115%);
  border: 1px solid rgba(91, 44, 16, 0.07);
  border-radius: 8px;
  padding: 8px 14px !important;
  box-shadow: 0 5px 18px rgba(30, 20, 10, 0.045) !important;
  overflow: hidden;
}
.dropdown a { padding: 6px 0; }
.sketchbook-stage{width:min(1300px,calc(100% - 9vw));margin:12px auto 110px}
.book-spread{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:min(1180px,100%);aspect-ratio:1.48/1;margin:0 auto;perspective:2200px;isolation:isolate}
.book-page{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-width:0;height:100%;padding:clamp(12px,2.4vw,36px);overflow:hidden;border:0;background-color:#f8f7f2;background-image:linear-gradient(rgba(102,132,151,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(102,132,151,.15) 1px,transparent 1px);background-size:22px 22px;cursor:pointer}
.book-page-left{box-shadow:inset -12px 0 20px -20px rgba(57,42,29,.5),-3px 4px 12px rgba(57,42,29,.08)}
.book-page-right{box-shadow:inset 12px 0 20px -20px rgba(57,42,29,.5),3px 4px 12px rgba(57,42,29,.08)}
.book-page img,.page-face img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.book-page img[hidden],.page-face img[hidden]{display:none}
.book-spread::after{content:"";position:absolute;z-index:4;top:0;bottom:0;left:50%;width:1px;background:linear-gradient(transparent,rgba(67,50,35,.18) 8%,rgba(67,50,35,.18) 92%,transparent);pointer-events:none}
.page-turn{display:none;position:absolute;top:0;bottom:0;z-index:3;width:50%;transform-style:preserve-3d;pointer-events:none}
.page-turn-next{right:0;transform-origin:left center}
.page-turn-prev{left:0;transform-origin:right center}
.page-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:clamp(12px,2.4vw,36px);overflow:hidden;background-color:#f8f7f2;background-image:linear-gradient(rgba(102,132,151,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(102,132,151,.15) 1px,transparent 1px);background-size:22px 22px;backface-visibility:hidden}
.page-front{box-shadow:0 4px 16px rgba(57,42,29,.12)}
.page-back{transform:rotateY(180deg);box-shadow:0 4px 16px rgba(57,42,29,.12)}
.turning-next{animation:turn-forward .72s cubic-bezier(.45,.02,.2,1) forwards}
.turning-prev{animation:turn-back .72s cubic-bezier(.45,.02,.2,1) forwards}
.page-turn.turning-next,.page-turn.turning-prev{display:block}
@keyframes turn-forward{to{transform:rotateY(-180deg)}}
@keyframes turn-back{to{transform:rotateY(180deg)}}
.book-navigation{display:flex;align-items:center;justify-content:center;gap:26px;margin:20px auto 0}
.book-navigation button{border:0;border-bottom:1px solid rgba(91,44,16,.34);padding:7px 3px;background:none;color:var(--text);font:20px Arial,sans-serif;cursor:pointer}
.book-navigation button:hover{border-color:var(--text)}
.book-position{min-width:120px;text-align:center;font-size:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
@media(max-width:700px){.sketchbook-stage{width:calc(100% - 24px);margin:10px auto 90px}.book-spread{aspect-ratio:1.38/1}.book-page,.page-face{padding:10px}.book-navigation{margin-top:14px}}
@media(max-width:700px){.book-spread{max-width:calc(138vh - 276px)}}
@supports (height:100dvh){.book-spread{max-width:calc(148dvh - 325.6px)}}
@supports (height:100dvh){@media(max-width:700px){.book-spread{max-width:calc(138dvh - 276px)}}}
@media(prefers-reduced-motion:reduce){.turning-next,.turning-prev{animation-duration:1ms}}


</style><style>
body{background-position:center,49.7% 49.8%;background-size:auto,140% auto;animation:texture-pan 8s ease-in-out infinite alternate}
@keyframes texture-pan{0%{background-position:center,48.5% 49%}20%{background-position:center,51.5% 48.5%}42%{background-position:center,50% 51.5%}66%{background-position:center,48.5% 51%}84%{background-position:center,51.5% 49%}100%{background-position:center,48.5% 49%}}
@media(prefers-reduced-motion:reduce){body{animation:none}}
</style></head><body>

<main class="sketchbook-stage" aria-label="Interactive sketchbook">
  <div class="book-spread" id="book-spread" tabindex="0" aria-label="Sketchbook pages. Use left and right arrow keys to turn.">
    <button class="book-page book-page-left" id="book-left" type="button" aria-label="Turn to previous spread"><img id="page-left" src="optimized/sketchbook/IMG_9953.webp" alt="Sketchbook page 1"></button>
    <button class="book-page book-page-right" id="book-right" type="button" aria-label="Turn to next spread"><img id="page-right" src="optimized/sketchbook/IMG_1914_result.webp" alt="Sketchbook page 2"></button>
    <div class="page-turn page-turn-next" id="page-turn-next" aria-hidden="true"><div class="page-face page-front"><img id="next-front" alt=""></div><div class="page-face page-back"><img id="next-back" alt=""></div></div>
    <div class="page-turn page-turn-prev" id="page-turn-prev" aria-hidden="true"><div class="page-face page-front"><img id="prev-front" alt=""></div><div class="page-face page-back"><img id="prev-back" alt=""></div></div>
  </div>
  <nav class="book-navigation" aria-label="Sketchbook navigation">
    <button id="book-previous" type="button" aria-label="Previous spread">←</button>
    <span class="book-position" id="book-position" aria-live="polite">Pages 1 &amp; 2</span>
    <button id="book-next" type="button" aria-label="Next spread">→</button>
  </nav>
</main>

<script>
const toggle=document.getElementById('projects-toggle'),dropdown=document.getElementById('projects-dropdown');toggle.addEventListener('click',e=>{e.preventDefault();const open=dropdown.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));});document.addEventListener('click',e=>{if(!toggle.contains(e.target)&&!dropdown.contains(e.target)){dropdown.classList.remove('open');toggle.setAttribute('aria-expanded','false')}});
const pages=[
  {src:'optimized/sketchbook/IMG_9953.webp',alt:'Sketchbook page 1'},
  {src:'optimized/sketchbook/IMG_1914_result.webp',alt:'Sketchbook page 2'},
  {src:'optimized/sketchbook/A2F62B49-CE3F-408C-90D0-A68759F3BB62_result.webp',alt:'Sketchbook page 3'},
  {src:'optimized/sketchbook/IMG_1784_result.webp',alt:'Sketchbook page 4'},
  {src:'optimized/sketchbook/IMG_1797_result.webp',alt:'Sketchbook page 5'},
  {src:'optimized/sketchbook/IMG_8311_result.webp',alt:'Sketchbook page 6'},
  {src:'optimized/sketchbook/IMG_2038_result.webp',alt:'Sketchbook page 7'},
  {src:'optimized/sketchbook/IMG_8313_result.webp',alt:'Sketchbook page 8'},
  {src:'optimized/sketchbook/IMG_0449.webp',alt:'Sketchbook page 9'},
  {src:'optimized/sketchbook/3125ECAC-69FA-47A9-974E-589AC83A1E5F_result.webp',alt:'Sketchbook page 10'},
  {src:'optimized/sketchbook/3722E9ED-B8F8-4600-A696-34BD3E5F9579_result.webp',alt:'Sketchbook page 11'}
];
const spread=document.getElementById('book-spread'),leftPage=document.getElementById('page-left'),rightPage=document.getElementById('page-right'),position=document.getElementById('book-position');
const nextTurn=document.getElementById('page-turn-next'),prevTurn=document.getElementById('page-turn-prev'),spreadCount=Math.ceil(pages.length/2);let currentSpread=0,isTurning=false;
function setPage(buttonId,imageId,index){const button=document.getElementById(buttonId),image=document.getElementById(imageId),page=pages[index];button.setAttribute('aria-label',page?`Turn from ${page.alt}`:'Blank endpaper');if(page){image.src=page.src;image.alt=page.alt;image.hidden=false}else{image.removeAttribute('src');image.alt='';image.hidden=true}}
function setFace(imageId,index){const image=document.getElementById(imageId),page=pages[index];if(page){image.src=page.src;image.alt=page.alt;image.hidden=false}else{image.removeAttribute('src');image.alt='';image.hidden=true}}
function renderSpread(index){currentSpread=(index+spreadCount)%spreadCount;const first=currentSpread*2;setPage('book-left','page-left',first);setPage('book-right','page-right',first+1);const labels=[pages[first],pages[first+1]].filter(Boolean).map(page=>page.alt.replace(/^Sketchbook page /,''));position.textContent=labels.length===2?`Pages ${labels.join(' & ')}`:labels.length===1?`Page ${labels[0]}`:'Blank spread'}
renderSpread(0);
function turnSpread(direction){if(isTurning)return;isTurning=true;const nextIndex=(currentSpread+direction+spreadCount)%spreadCount,first=nextIndex*2,turn=direction>0?nextTurn:prevTurn;setFace(direction>0?'next-front':'prev-front',direction>0?currentSpread*2+1:currentSpread*2);setFace(direction>0?'next-back':'prev-back',direction>0?first:first+1);renderSpread(nextIndex);turn.classList.remove('turning-next','turning-prev');void turn.offsetWidth;turn.classList.add(direction>0?'turning-next':'turning-prev');turn.addEventListener('animationend',()=>{turn.classList.remove('turning-next','turning-prev');isTurning=false},{once:true})}
document.getElementById('book-left').addEventListener('click',()=>turnSpread(-1));document.getElementById('book-right').addEventListener('click',()=>turnSpread(1));document.getElementById('book-previous').addEventListener('click',()=>turnSpread(-1));document.getElementById('book-next').addEventListener('click',()=>turnSpread(1));spread.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();turnSpread(e.key==='ArrowRight'?1:-1)}});
</script></body></html>
